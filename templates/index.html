<!DOCTYPE html>
<html>

<head>

    <title>AI Signal Analytics Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container mt-5">

    <div class="card p-5 shadow">

        <h1 class="text-center text-primary mb-4">
            AI Signal Analytics Platform
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <!-- Upload CSV -->
            <div class="mb-3">

                <label class="form-label">
                    Upload CSV File
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="file"
                    required>

            </div>

            <!-- Filter Selection -->
            <div class="mb-3">

                <label class="form-label">
                    Choose Filter
                </label>

                <select
    name="filter_type"
    class="form-select">

    <option value="original">
        Original Signal
    </option>

    <option value="lowpass">
        Low Pass Filter
    </option>

    <option value="highpass">
        High Pass Filter
    </option>

    <option value="bandpass">
        Band Pass Filter
    </option>

</select>

<div class="mb-3">
    <label class="form-label">Sampling Frequency (Hz)</label>
    <input type="number" class="form-control"
           name="sampling_frequency"
           value="1000"
           required>
</div>

<div class="mb-3">
    <label class="form-label">Filter Order</label>
    <input type="number" class="form-control"
           name="filter_order"
           value="4"
           min="1"
           max="10">
</div>

<div class="mb-3">
    <label class="form-label">Cutoff Frequency (Hz)</label>
    <input type="number" class="form-control"
           name="cutoff_frequency"
           value="50">
</div>

<div class="mb-3">
    <label class="form-label">Low Cutoff (Band Pass)</label>
    <input type="number" class="form-control"
           name="low_cutoff"
           value="20">
</div>

<div class="mb-3">
    <label class="form-label">High Cutoff (Band Pass)</label>
    <input type="number" class="form-control"
           name="high_cutoff"
           value="100">
</div>

            <!-- Upload Button -->
            <button
                type="submit"
                class="btn btn-primary w-100">

                Upload Signal

            </button>

        </form>

    </div>

</div>

</body>

</html>
